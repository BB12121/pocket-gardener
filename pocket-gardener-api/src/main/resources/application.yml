server:
  port: 8080

spring:
  application:
    name: pocket-gardener-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pocket_gardener?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    com.pocketgardener: INFO

qweather:
  host: ${QWEATHER_HOST:devapi.qweather.com}
  api-key: ${QWEATHER_API_KEY:}
  location: ${QWEATHER_LOCATION:101210101}
  city: ${QWEATHER_CITY:杭州}

ai:
  base-url: ${AI_BASE_URL:https://api.openai.com}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-5.4-mini}
